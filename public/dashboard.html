<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivos do Acervo - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Playfair Display', serif; background-color: #f4ecd8; color: #3e3124; background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');}
        .input-classic { width: 100%; padding: 0.5rem; margin-bottom: 1rem; background-color: #fbf6ec; border: 1px solid #a68a61; border-radius: 0.25rem; outline: none; }
        .input-classic:focus { box-shadow: 0 0 0 2px #8c6b42; }
    </style>
</head>
<body class="min-h-screen p-10 relative">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-5xl font-bold text-[#5c4731] tracking-wider uppercase" id="titulo">Acervo Solidário</h1>
            <a href="index.html" class="text-[#8c6b42] hover:underline text-xl italic">&larr; Voltar ao Registro</a>
        </div>

        <div id="status-mensagem" class="text-center my-6 hidden text-xl italic font-bold"></div>

        <div class="bg-[#fbf8f1] border-2 border-[#a68a61] shadow-2xl overflow-hidden rounded">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-[#e8dcb8] text-[#5c4731] border-b-2 border-[#a68a61]">
                        <th class="p-4 font-bold uppercase tracking-wider">Benfeitor</th>
                        <th class="p-4 font-bold uppercase tracking-wider">A Oferenda</th>
                        <th class="p-4 font-bold uppercase tracking-wider">Quantia</th>
                        <th class="p-4 font-bold uppercase tracking-wider">Classificação</th>
                        <th class="p-4 font-bold uppercase tracking-wider text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="modal-edicao" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-[#fbf8f1] border-2 border-[#8c6b42] p-8 rounded-lg shadow-2xl w-full max-w-md relative bg-[url('https://www.transparenttextures.com/patterns/aged-paper.png')]">
            <h2 class="text-3xl font-bold text-[#5c4731] mb-4 border-b border-[#a68a61] pb-2">Retificar Registro</h2>
            
            <input type="hidden" id="edit-id">
            
            <label class="block mb-1 font-bold text-[#5c4731]">A Oferenda (Item)</label>
            <input type="text" id="edit-descricao" class="input-classic">
            
            <div class="flex gap-4">
                <div class="w-1/2">
                    <label class="block mb-1 font-bold text-[#5c4731]">Quantia</label>
                    <input type="number" id="edit-quantidade" class="input-classic">
                </div>
                <div class="w-1/2">
                    <label class="block mb-1 font-bold text-[#5c4731]">Medida</label>
                    <select id="edit-medida" class="input-classic">
                        <option value="Unidade">Unidade(s)</option>
                        <option value="Kg">Quilo(s) - Kg</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-4 mt-4">
                <button onclick="salvarEdicao()" class="w-1/2 bg-[#8c6b42] hover:bg-[#5c4731] text-[#fbf6ec] py-2 rounded font-bold uppercase tracking-wider transition-colors">Salvar</button>
                <button onclick="fecharModal()" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 py-2 rounded font-bold uppercase tracking-wider transition-colors">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        gsap.from("#titulo", { duration: 1.2, opacity: 0, x: -50, ease: "power2.out" });
        
        async function carregarDados() {
            const tbody = document.getElementById('tabela-corpo');
            const msgStatus = document.getElementById('status-mensagem');

            try {
                const response = await fetch('/api/estoque');
                if (!response.ok) throw new Error("Erro no servidor");

                const dados = await response.json();
                
                if (dados.length === 0) {
                    tbody.innerHTML = "";
                    msgStatus.innerText = "📜 Nenhuma dádiva registrada nos pergaminhos.";
                    msgStatus.style.color = "#7a6248";
                    msgStatus.classList.remove('hidden');
                    return;
                }

                msgStatus.classList.add('hidden');
                tbody.innerHTML = "";
                
                dados.forEach((linha) => {
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-[#d1c2a3] hover:bg-[#f1e6d0] transition-colors item-tabela";
                    
                    // Escapando as aspas da descrição para não quebrar a função JS
                    const descSafe = linha.descricao_item.replace(/'/g, "\\'");

                    tr.innerHTML = `
                        <td class="p-4 font-bold">${linha.nome_doador}</td>
                        <td class="p-4 italic">${linha.descricao_item}</td>
                        <td class="p-4">${linha.quantidade} ${linha.tipo_medida}</td>
                        <td class="p-4">${linha.nome_categoria}</td>
                        <td class="p-4 text-center">
                            <button onclick="abrirModal(${linha.id_doacao}, '${descSafe}', ${linha.quantidade}, '${linha.tipo_medida}')" class="text-blue-600 hover:text-blue-800 font-bold mr-3 underline">Editar</button>
                            <button onclick="deletarRegistro(${linha.id_doacao})" class="text-red-600 hover:text-red-800 font-bold underline">Excluir</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                gsap.from(".item-tabela", { duration: 0.5, opacity: 0, y: 10, stagger: 0.05, ease: "power1.out" });
            } catch (error) {
                msgStatus.innerText = "❌ Erro ao conectar com os arquivos.";
                msgStatus.style.color = "#c62828";
                msgStatus.classList.remove('hidden');
            }
        }

        // Lógica de Deletar
        async function deletarRegistro(id) {
            if(confirm("Tem certeza que deseja apagar este registro dos pergaminhos?")) {
                try {
                    await fetch(`/api/doacoes/${id}`, { method: 'DELETE' });
                    carregarDados(); // Recarrega a tabela
                } catch (error) {
                    alert("Erro ao excluir.");
                }
            }
        }

        // Lógica de Editar (Modal)
        function abrirModal(id, descricao, quantidade, medida) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-descricao').value = descricao;
            document.getElementById('edit-quantidade').value = quantidade;
            document.getElementById('edit-medida').value = medida;
            document.getElementById('modal-edicao').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modal-edicao').classList.add('hidden');
        }

        async function salvarEdicao() {
            const id = document.getElementById('edit-id').value;
            const dadosAtualizados = {
                descricao: document.getElementById('edit-descricao').value,
                quantidade: document.getElementById('edit-quantidade').value,
                tipoMedida: document.getElementById('edit-medida').value
            };

            try {
                await fetch(`/api/doacoes/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosAtualizados)
                });
                fecharModal();
                carregarDados(); // Recarrega a tabela
            } catch (error) {
                alert("Erro ao salvar alterações.");
            }
        }

        // Inicia o carregamento ao abrir a tela
        window.onload = carregarDados;
    </script>
</body>
</html>
